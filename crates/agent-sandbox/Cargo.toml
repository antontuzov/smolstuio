[package]
name = "agent-sandbox"
description = "Approval modes, path and command policy, secret redaction, audit log and rollback snapshots"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
agent-config.workspace = true
smollm-core.workspace = true
globset.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true

[dev-dependencies]
serde_json.workspace = true
tempfile = "3"

# `cargo bench -p agent-sandbox`. `harness = false` because the measurement is a
# std timing loop with its conditions printed, not a comparison against a stored
# baseline: the point is that anyone can re-measure it, not that a number is kept.
# Benches are not run by `cargo test --all`.
[[bench]]
name = "redaction"
harness = false
