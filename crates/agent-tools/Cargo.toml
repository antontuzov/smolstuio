[package]
name = "agent-tools"
description = "Tool trait, tool registry, JSON schemas and the agent's own file, git and shell tools"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
agent-config.workspace = true
agent-repo.workspace = true
agent-sandbox.workspace = true
smollm-core.workspace = true
async-trait.workspace = true
globset.workspace = true
ignore.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true

[dev-dependencies]
tempfile = "3"

# `cargo bench -p agent-tools`. `harness = false` because the measurement is a
# std timing loop with its conditions printed, not a comparison against a stored
# baseline: the point is that anyone can re-measure it, not that a number is kept.
# Benches are not run by `cargo test --all`.
[[bench]]
name = "list_pricing"
harness = false
