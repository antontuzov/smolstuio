[package]
name = "agent-repo"
description = "Repository indexing: ignore rules, Cargo detection, repo map, relevance scoring, diffs and patches"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
agent-sandbox.workspace = true
smollm-core.workspace = true
# Manifests are read as files, not by asking cargo: `cargo metadata` resolves
# the dependency graph, which can reach the registry over the network. A
# local-first agent answers "what is this project" from the text on disk.
toml.workspace = true
globset.workspace = true
ignore.workspace = true
serde.workspace = true
serde_json.workspace = true
similar.workspace = true
thiserror.workspace = true
tracing.workspace = true

[dev-dependencies]
tempfile = "3"

# `cargo bench -p agent-repo`. `harness = false` because the measurement is a
# std timing loop with its conditions printed, not a comparison against a stored
# baseline: the point is that anyone can re-measure it, not that a number is kept.
# Benches are not run by `cargo test --all`.
[[bench]]
name = "repo_map"
harness = false
