[package]
name = "agent-cli"
description = "The smoll command line interface for the SmolLLM coding agent"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "smoll"
path = "src/main.rs"

[features]
# No backend by default: `smoll` runs against the mock and echo providers, and a
# real one is opt-in with the feature it names.
default = []
openai-compatible = ["agent-providers/openai-compatible"]
gguf = ["agent-providers/gguf"]
llama-cpp = ["agent-providers/llama-cpp"]

[dependencies]
agent-config.workspace = true
agent-core.workspace = true
agent-providers.workspace = true
agent-repo.workspace = true
agent-sandbox.workspace = true
agent-tools.workspace = true
agent-tui.workspace = true
smollm-core.workspace = true
smollm-hardware.workspace = true
async-trait.workspace = true
clap.workspace = true
# `smoll eval` writes its fixture workspaces where nothing it makes can be
# mistaken for the repository under test.
serde.workspace = true
serde_json.workspace = true
tempfile = "3"
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
uuid.workspace = true

[dev-dependencies]
tempfile = "3"
