[workspace]
resolver = "2"
members = [
  # The model layer: discovery, verified downloads, hardware, engines, server.
  "crates/smollm-core",
  "crates/smollm-engine",
  "crates/smollm-models",
  "crates/smollm-hardware",
  "crates/smollm-server",
  "crates/smollm-cli",
  # The agent: a repo-aware coding agent that drives those models. New code
  # lives here; the crates above are consumed, not rewritten.
  "crates/agent-config",
  "crates/agent-sandbox",
  "crates/agent-tools",
  "crates/agent-repo",
  "crates/agent-providers",
  "crates/agent-core",
  "crates/agent-tui",
  "crates/agent-cli",
  # Frozen: keeps building and passing its gates, gets no new features.
  "desktop/src-tauri",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.77"
license = "MIT"
authors = ["SmolLLM Studio contributors"]
repository = "https://github.com/antontuzov/smollm-studio"
homepage = "https://github.com/antontuzov/smollm-studio"

[workspace.dependencies]
# --- internal crates ---
smollm-core = { path = "crates/smollm-core" }
smollm-engine = { path = "crates/smollm-engine" }
smollm-models = { path = "crates/smollm-models" }
smollm-hardware = { path = "crates/smollm-hardware" }
smollm-server = { path = "crates/smollm-server" }

agent-config = { path = "crates/agent-config" }
agent-sandbox = { path = "crates/agent-sandbox" }
agent-tools = { path = "crates/agent-tools" }
agent-repo = { path = "crates/agent-repo" }
agent-providers = { path = "crates/agent-providers" }
agent-core = { path = "crates/agent-core" }
agent-tui = { path = "crates/agent-tui" }

# --- async / runtime ---
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["rt"] }
futures = "0.3"
futures-util = "0.3"
async-trait = "0.1"

# --- serialization ---
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"

# --- errors / logging ---
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# --- http / downloads ---
reqwest = { version = "0.12", default-features = false, features = [
  "json",
  "stream",
  "rustls-tls",
] }
axum = { version = "0.8", features = ["tokio", "macros"] }
tower-http = { version = "0.6", features = ["cors", "trace"] }
url = "2"

# --- system / files ---
sysinfo = "0.33"
fs2 = "0.4"
sha2 = "0.10"
hex = "0.4"
walkdir = "2"
# Directory walking that honours .gitignore, which is the whole point of a
# repository index: target/ and node_modules are context noise, not context.
ignore = "0.4"
globset = "0.4"
similar = "2"
cargo_metadata = "0.18"

# --- credentials ---
# The platform's own store, and nothing else: no store feature is enabled here
# because the two that work on Linux need either a D-Bus session server or a C
# library, and a Hugging Face token is only worth a dependency on the platforms
# this app ships bundles for. See smollm-core's target-specific dependencies.
keyring = { version = "3.6", default-features = false }

# --- misc ---
uuid = { version = "1", features = ["v4", "serde"] }
clap = { version = "4", features = ["derive"] }

# --- the terminal UI (agent-tui) ---
# Held at 0.29 on purpose: 0.30 needs rustc 1.88 and this workspace's floor is
# 1.77, so a person on a distribution toolchain from last year can still build
# the binary. crossterm is pinned to the line ratatui 0.29 itself requires — a
# second copy of it in the tree would mean the event loop and the backend
# reading and writing two different terminal handles. Its own feature names are
# the ones 0.28 answers to: `events` for reading a key, `event-stream` for an
# async iterator (which this crate does not need, because the screen polls the
# keyboard on a thread of its own), and no `cursor` feature at all — moving the
# cursor is not optional there.
ratatui = { version = "0.29", default-features = false, features = ["crossterm"] }
crossterm = { version = "0.28", default-features = false, features = [
    "events",
    "bracketed-paste",
    "windows",
] }

# --- native inference (opt-in feature only: it builds the vendored llama.cpp) ---
# Never a default, because it needs cmake plus a C/C++ toolchain this repo
# cannot assume. On Apple machines llama.cpp's own build also adds its Metal
# backend when the toolchain can compile it, so GPU availability is asked of the
# library at runtime rather than promised by a feature.
llama-cpp-2 = { version = "0.1.159", default-features = false }

# --- desktop ---
tauri = { version = "2", features = [] }
tauri-build = { version = "2", features = [] }
# Native open/save panels. Importing a model and exporting a transcript both
# need a real path, and the webview will not hand one out without this.
tauri-plugin-dialog = { version = "2" }
# The window comes back the size and place the user left it, which a desktop app
# is expected to do and this one did not.
tauri-plugin-window-state = { version = "2" }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "unwind"
