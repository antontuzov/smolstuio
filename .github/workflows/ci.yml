name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_LOG: warn

jobs:
  rust:
    name: Rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal --component clippy,rustfmt
          rustup default stable
        shell: bash

      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Tests
        run: cargo test --all

      # `agent-providers`' GGUF and HTTP adapters are behind features, so the job
      # above never compiles them. They build against this repo's own engine layer
      # with the mock engine in place of llama.cpp, so no C++ toolchain is needed
      # here — this step is the guard against an adapter that only compiles in a
      # feature build nobody runs.
      - name: Clippy (provider adapters)
        run: cargo clippy -p agent-providers --all-targets --features gguf,openai-compatible -- -D warnings

      - name: Tests (provider adapters)
        run: cargo test -p agent-providers --features gguf,openai-compatible

  # llama.cpp is compiled from source by the `llama-cpp` feature, so it needs
  # cmake and a C++ toolchain and takes real minutes. It is checked here, on the
  # two platforms whose runners are guaranteed to have that, rather than making
  # every job above wait for a native build. Windows is deliberately not in this
  # matrix yet: see docs/models.md.
  native-engine:
    name: Native engine (llama.cpp)
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal --component clippy,rustfmt
          rustup default stable
        shell: bash

      - uses: Swatinem/rust-cache@v2

      - name: Install cmake (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y cmake

      - name: Clippy (engine)
        run: cargo clippy -p smollm-engine --all-targets --features llama-cpp -- -D warnings

      - name: Clippy (CLI)
        run: cargo clippy -p smollm-cli --all-targets --features llama-cpp -- -D warnings

      - name: Engine tests
        run: cargo test -p smollm-engine --features llama-cpp

      # The GGUF provider is the reason the engine layer is reused rather than
      # re-implemented, so it is checked against the real linked engine here: the
      # job above can only compile it with the mock engine in its place. No
      # weights are downloaded — the adapter's own tests inject an engine and the
      # build path only asks whether one is available.
      - name: Clippy (gguf provider)
        run: cargo clippy -p agent-providers --all-targets --features llama-cpp -- -D warnings

      - name: Gguf provider tests
        run: cargo test -p agent-providers --features llama-cpp

      - name: Clippy (agent CLI)
        run: cargo clippy -p agent-cli --all-targets --features llama-cpp -- -D warnings

      # The desktop shell needs Tauri's system libraries, which macOS has and a
      # plain Ubuntu runner does not.
      - name: Clippy (desktop shell)
        if: runner.os == 'macOS'
        run: cargo clippy -p smollm-studio-desktop --all-targets --features llama-cpp -- -D warnings

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable pnpm through corepack
        run: corepack enable && corepack prepare --activate
        shell: bash

      - uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/desktop/node_modules
          key: pnpm-${{ hashFiles('desktop/pnpm-lock.yaml') }}

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Build
        run: pnpm build

  # The default `mock` engine must never need a GPU, a C++ toolchain or the
  # network: this job is the guard against accidentally making it so.
  cli-smoke:
    name: CLI smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: Swatinem/rust-cache@v2

      - name: Build the CLI
        run: cargo build -p smollm-cli --bin smollm

      - name: hardware
        run: cargo run -q -p smollm-cli --bin smollm -- hardware

      - name: models list
        run: cargo run -q -p smollm-cli --bin smollm -- models list --json

      - name: serve snippets
        run: cargo run -q -p smollm-cli --bin smollm -- serve --examples-only
